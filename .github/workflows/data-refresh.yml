# Periodic data refresh + GitHub Pages deploy (SPEC §8). Skeleton in M0; ETL
# wired in M1; finalized in M9; Pages deploy wired post-M9 (hosting decision).
#
# Re-runs the offline pipeline end-to-end (real sources: Codeberg AT-HYG/HYG,
# NASA Exoplanet Archive TAP, Stellarium skyculture), regenerates the artifacts,
# and validates them. On any TAP/network failure the step fails so the run is
# RED and visible (SPEC §10); the runner data is ephemeral, so previously
# published data is never touched by a failed run.
#
# dry_run (default true): regenerate + validate + upload the artifacts as a CI
# artifact, but do NOT deploy. The scheduled run (and a manual run with
# dry_run=false) also runs the `deploy` job.
#
# Hosting (human decision at the [FINAL HUMAN CHECK]): GitHub Pages. The data
# (~155 MB, gitignored, CC BY-SA 4.0) never enters git: the deploy job builds
# the app with the repo sub-path as base and ships the freshly validated data
# artifact under <base>/data/, plus NOTICE.md/LICENSE for attribution. Pages
# must be set to "GitHub Actions" as its source (repo Settings → Pages).
# To deploy app code changes, run this workflow manually with dry_run=false.
name: Data refresh & deploy

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Regenerate + validate + upload artifact, but do not publish'
        type: boolean
        default: true
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC

# A scheduled run (no inputs) publishes; a manual run honors the dry_run input.
env:
  DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: data-pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: data-pipeline/requirements.txt

      - run: pip install -r requirements.txt

      # ETL in dependency order (data-pipeline/README.md). Each script fails the
      # job on a source/network error (default bash -e): a refresh that cannot
      # reach a source is RED, not silently stale (SPEC §10).
      - name: Fetch constellation skyculture (Stellarium)
        run: python fetch_constellations.py --force
      - name: Fetch AT-HYG + HYG catalogs (Codeberg)
        run: python fetch_athyg.py --force
      - name: Fetch exoplanets (NASA Exoplanet Archive TAP)
        run: python fetch_exoplanets.py
      - name: Build star binary (SoA + manifest + names index + catalog ids)
        run: python build_star_binary.py
      - name: Cross-match exoplanet hosts → stars
        run: python crossmatch.py
      - name: Build constellation lines
        run: python build_constellations.py

      # Validate the regenerated artifacts: the pipeline test suite (transforms,
      # SoA roundtrip, cross-match, golden fixtures) plus presence/non-emptiness
      # of the freshly built production artifacts.
      - name: Validate (pytest)
        run: python -m pytest -q
      - name: Validate regenerated artifacts
        run: python validate_artifacts.py

      # Always uploaded: dry-run verification, and the input of the deploy job.
      - name: Upload regenerated data artifact
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-map-data
          # Raw downloads (~200 MB) are excluded; ship only the served artifacts.
          path: |
            data/stars.bin
            data/stars.manifest.json
            data/names.index.json
            data/catalog-ids.bin
            data/catalog-ids.manifest.json
            data/exoplanets.json
            data/constellations.json
            data/search
          if-no-files-found: error
          retention-days: 14


  deploy:
    needs: refresh
    # Job-level `if` cannot read `env`: same rule as DRY_RUN, spelled out.
    if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # Project Pages are served from /<repo>/: the app base and every data URL
      # derive from VITE_BASE (vite.config.ts, src/data/starData.ts).
      - name: Build app for Pages
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Add the validated data artifact under dist/data
        uses: actions/download-artifact@v4
        with:
          name: galaxy-map-data
          path: app/dist/data

      # CC BY-SA 4.0 attribution travels with the published data (SPEC §12).
      - name: Add attribution and license files
        run: cp ../NOTICE.md ../LICENSE dist/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
