name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.60 cannot
    # install chromium; unpin when the pinned Playwright supports it.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  data-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: data-pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
